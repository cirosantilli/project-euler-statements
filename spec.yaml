1:
  comment: "Signature: solve(n: int) -> int."
  args:
    n: int
  constraints:
    - n > 1
  return:
    type: int
    desc: Sum of all the multiples of 3 or 5 below `n`.
2:
  comment: "Signature: solve(limit: int) -> int."
  args:
    limit: int
  constraints:
    - limit > 1
  return:
    type: int
    desc: Sum of the even-valued Fibonacci numbers which do not exceed `limit`.
3:
  comment: "Signature: solve(n: int) -> int."
  args:
    n: int
  constraints:
    - n > 1
  return:
    type: int
    desc: The largest prime factor of `n`.
4:
  args:
    n: int
  constraints:
    - n > 0
  comment: "Signature: solve(n: int) -> int. The optimized largest_palindrome_product(lo, hi) helper also accepts an inclusive factor range."
  return:
    type: int
    desc: The largest palindrome made of the product of two `n`-decimal-digit numbers.
5:
  comment: "Signature: solve(n: int) -> int."
  args:
    n: int
  constraints:
    - n >= 0
  return:
    type: int
    desc: The least common multiple of the integers from 1 through `n`, or 1 when `n` is zero.
6:
  comment: "Signature: solve(n: int) -> int."
  args:
    n: int
  constraints:
    - n >= 0
  return:
    type: int
    desc: The square of the sum of the integers from 1 through `n`, minus the sum of their squares.
7:
  comment: "Signature: solve(n: int) -> int."
  args:
    n: int
  constraints:
    - n >= 1
  return:
    type: int
    desc: The `n`'th prime number.
8:
  comment: "Signature: solve(digits: list[int], k: int) -> int."
  args:
    digits: list[int]
    k: int
  constraints:
    - len(digits) > 0
    - all(0 <= digit <= 9 for digit in digits)
    - k > 0
  return:
    type: int
    desc: The largest product of k consecutive decimal digits in the input list.
9:
  comment: "Signature: solve(total: int) -> int. The naive function returns zero when no triplet exists; the optimized solver raises ValueError in that case."
  args:
    total: int
  constraints:
    - total >= 0
    - There exist positive integers a < b < c with a + b + c == total and a*a + b*b == c*c.
  return:
    type: int
    desc: The largest product a*b*c of a Pythagorean triplet with the given total.
10:
  comment: "Signature: solve(limit: int) -> int."
  args:
    limit: int
  constraints:
    - limit >= 0
  return:
    type: int
    desc: The sum of all primes strictly below limit.
11:
  comment: "Signature: max_adjacent_product(grid: list[list[int]], k: int = 4) -> int."
  args:
    grid: list[list[int]]
    k: int
  constraints:
    - k >= 0
    - The grid has 20 rows of 20 nonnegative integers each.
  return:
    type: int
    desc: The greatest product of k adjacent entries horizontally, vertically, or diagonally; zero if no segment fits, and one for zero-length segments.
12:
  comment: "Signature: first_triangular_with_over(k: int) -> int."
  args:
    k: int
  constraints:
    - k >= 0
  return:
    type: int
    desc: The least positive triangular number with more than k positive divisors.
13:
  comment: "Signature: solve(nums: list[int], k: int) -> int. The adapter uses the original string-based algorithm."
  args:
    nums: list[int]
    k: int
  constraints:
    - sum(nums) >= 0
    - k >= 0
  return:
    type: int
    desc: The integer represented by the first k decimal digits of the sum, or zero for an empty prefix. If k exceeds the digit count, return the whole sum.
15:
  comment: "Signature: solve(n: int) -> int. The lattice_paths(grid_n, grid_m) helper also accepts rectangular grids."
  args:
    n: int
  constraints:
    - n >= 0
  return:
    type: int
    desc: The number of paths through an n by n grid using only right and down steps; one for the zero grid.
16:
  comment: "Signature: solve(n: int = 1000) -> int."
  args:
    n: int
  constraints:
    - n >= 0
  return:
    type: int
    desc: The sum of the decimal digits of 2**n.
17:
  comment: "Signature: solve(n: int = 1000) -> int. The optimized solver uses the module's ONES, TEENS, and TENS spelling tables."
  args:
    n: int
  constraints:
    - 0 <= n <= 1000
    - ONES, TEENS, and TENS contain their declared English spellings, as specified by the Python Requires predicates.
  return:
    type: int
    desc: The total number of letters in the British English names of the integers from 1 through n, ignoring spaces and hyphens; zero for n = 0.
18:
  comment: "Signature: max_path_sum(triangle: list[list[int]]) -> int."
  args:
    triangle: list[list[int]]
  constraints:
    - The triangle is nonempty, and row i has i + 1 entries, counting from zero.
  return:
    type: int
    desc: The greatest sum along a path from the top to the bottom, moving to either adjacent child at each row. Weights may be signed integers.
19:
  comment: "Signature: count_sundays_on_first(start_year: int, end_year: int) -> int. The reference's naive_years adapter selects 1 January through 31 December; naive itself accepts arbitrary date endpoints."
  args:
    start_year: int
    end_year: int
  constraints:
    - 1900 <= start_year <= end_year
  return:
    type: int
    desc: The number of Sundays falling on the first day of a month in the inclusive range of complete calendar years.
1014:
  args:
    v: int
    k: int
    t: int
    nights: tuple[str, ...]
    target: str
  constraints:
    - 1 <= t <= k <= v <= 26
    - Members are the first v uppercase letters of the alphabet.
    - Each night contains k distinct members and target contains t distinct members.
    - The nights are blocks of an existing Steiner system S(t, k, v).
    - Exactly one k-subset containing target has all its intersections with the known nights in the intersection spectrum forced by these parameters.
  return:
    type: str
    desc: The unique compatible night containing target, with its members in alphabetic order.
  comment: Both implementations use the forced intersection spectrum. The naive version enumerates all k-subsets; the optimized version enumerates only supersets of target. Inputs outside the uniqueness constraint raise ValueError.
1015:
  args:
    n: int
    modulus: int
  constraints:
    - n >= 0
    - modulus >= 1
  return:
    type: int
    desc: The number of blue/red rows of n pins for which the second player wins regardless of the starting colour, reduced modulo modulus. The empty row counts once.
  comment: "Signature: solve(n: int, modulus: int = 10**9) -> int. The naive solve enumerates every row and the original game tree, preserving gaps. It is intended only for small n."
