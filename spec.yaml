1:
  comment: "Signature: solve(n: int) -> int."
  args:
    n: int
  constraints:
    - n > 1
  return:
    type: int
    desc: Sum of all the multiples of 3 or 5 below `n`.
2:
  comment: "Signature: solve(limit: int) -> int."
  args:
    limit: int
  constraints:
    - limit > 1
  return:
    type: int
    desc: Sum of the even-valued Fibonacci numbers which do not exceed `limit`.
3:
  comment: "Signature: solve(n: int) -> int."
  args:
    n: int
  constraints:
    - n > 1
  return:
    type: int
    desc: The largest prime factor of `n`.
4:
  args:
    n: int
  constraints:
    - n > 0
  comment: "Signature: solve(n: int) -> int. The optimized largest_palindrome_product(lo, hi) helper also accepts an inclusive factor range."
  return:
    type: int
    desc: The largest palindrome made of the product of two `n`-decimal-digit numbers.
5:
  comment: "Signature: solve(n: int) -> int."
  args:
    n: int
  constraints:
    - n >= 0
  return:
    type: int
    desc: The least common multiple of the integers from 1 through `n`, or 1 when `n` is zero.
6:
  comment: "Signature: solve(n: int) -> int."
  args:
    n: int
  constraints:
    - n >= 0
  return:
    type: int
    desc: The square of the sum of the integers from 1 through `n`, minus the sum of their squares.
7:
  comment: "Signature: solve(n: int) -> int."
  args:
    n: int
  constraints:
    - n >= 1
  return:
    type: int
    desc: The `n`'th prime number.
8:
  comment: "Signature: solve(digits: list[int], k: int) -> int."
  args:
    digits: list[int]
    k: int
  constraints:
    - len(digits) > 0
    - all(0 <= digit <= 9 for digit in digits)
    - k > 0
  return:
    type: int
    desc: The largest product of k consecutive decimal digits in the input list.
9:
  comment: "Signature: solve(total: int) -> int. The naive function returns zero when no triplet exists; the optimized solver raises ValueError in that case."
  args:
    total: int
  constraints:
    - total >= 0
    - There exist positive integers a < b < c with a + b + c == total and a*a + b*b == c*c.
  return:
    type: int
    desc: The largest product a*b*c of a Pythagorean triplet with the given total.
10:
  comment: "Signature: solve(limit: int) -> int."
  args:
    limit: int
  constraints:
    - limit >= 0
  return:
    type: int
    desc: The sum of all primes strictly below limit.
11:
  comment: "Signature: solve(grid: list[list[int]], k: int = 4) -> int."
  args:
    grid: list[list[int]]
    k: int
  constraints:
    - k >= 0
    - The grid has 20 rows of 20 nonnegative integers each.
  return:
    type: int
    desc: The greatest product of k adjacent entries horizontally, vertically, or diagonally; zero if no segment fits, and one for zero-length segments.
12:
  comment: "Signature: solve(k: int) -> int."
  args:
    k: int
  constraints:
    - k >= 0
  return:
    type: int
    desc: The least positive triangular number with more than k positive divisors.
13:
  comment: "Signature: solve(nums: list[int], k: int) -> int. The adapter uses the original string-based algorithm."
  args:
    nums: list[int]
    k: int
  constraints:
    - sum(nums) >= 0
    - k >= 0
  return:
    type: int
    desc: The integer represented by the first k decimal digits of the sum, or zero for an empty prefix. If k exceeds the digit count, return the whole sum.
15:
  comment: "Signature: solve(n: int) -> int. The lattice_paths(grid_n, grid_m) helper also accepts rectangular grids."
  args:
    n: int
  constraints:
    - n >= 0
  return:
    type: int
    desc: The number of paths through an n by n grid using only right and down steps; one for the zero grid.
16:
  comment: "Signature: solve(n: int = 1000) -> int."
  args:
    n: int
  constraints:
    - n >= 0
  return:
    type: int
    desc: The sum of the decimal digits of 2**n.
17:
  comment: "Signature: solve(n: int = 1000) -> int. The optimized solver uses the module's ONES, TEENS, and TENS spelling tables."
  args:
    n: int
  constraints:
    - 0 <= n <= 1000
    - ONES, TEENS, and TENS contain their declared English spellings, as specified by the Python Requires predicates.
  return:
    type: int
    desc: The total number of letters in the British English names of the integers from 1 through n, ignoring spaces and hyphens; zero for n = 0.
18:
  comment: "Signature: solve(triangle: list[list[int]]) -> int."
  args:
    triangle: list[list[int]]
  constraints:
    - The triangle is nonempty, and row i has i + 1 entries, counting from zero.
  return:
    type: int
    desc: The greatest sum along a path from the top to the bottom, moving to either adjacent child at each row. Weights may be signed integers.
19:
  comment: "Signature: solve(start_year: int, end_year: int) -> int. The reference's naive_years adapter selects 1 January through 31 December; naive itself accepts arbitrary date endpoints."
  args:
    start_year: int
    end_year: int
  constraints:
    - 1900 <= start_year <= end_year
  return:
    type: int
    desc: The number of Sundays falling on the first day of a month in the inclusive range of complete calendar years.
22:
  comment: "Signature: solve(names: list[str]) -> int."
  args:
    names: list[str]
  constraints:
    - Every character in each name is an uppercase ASCII letter A through Z. Empty names and an empty list are allowed.
  return:
    type: int
    desc: The sum of each name's alphabetical value multiplied by its one-based position after sorting the names alphabetically.
23:
  comment: "Signature: solve(limit: int = 28123) -> int. The optimized solver's embedded checks require indices 24 and 28 to exist."
  args:
    limit: int
  constraints:
    - limit >= 28
  return:
    type: int
    desc: The sum of the positive integers at most limit that cannot be written as the sum of two abundant numbers.
24:
  comment: "Signature: solve(digits: list[int], n: int) -> str. The reference naive_text formats naive's list result without changing its permutation ordering."
  args:
    digits: list[int]
    n: int
  constraints:
    - The input integers are strictly increasing.
    - 1 <= n <= factorial(len(digits))
  return:
    type: str
    desc: The concatenated decimal representations of the integers in the one-based n-th lexicographic permutation. The empty input has one permutation, rendered as an empty string.
25:
  comment: "Signature: solve(digits: int) -> int. The reference naive uses the parameter name n and also terminates at zero, returning index zero."
  args:
    digits: int
  constraints:
    - digits >= 1
  return:
    type: int
    desc: The least index whose Fibonacci number has at least digits decimal digits, with F_0 = 0 and F_1 = 1.
26:
  comment: "Signature: solve(limit: int = 1000) -> int. The reference naive also terminates for every integer limit. At limit = 3 its inclusion of denominator zero gives a different zero-length tie winner, so the equivalence domain starts at 4."
  args:
    limit: int
  constraints:
    - limit >= 4
  return:
    type: int
    desc: The smallest positive denominator below limit whose reciprocal has the longest recurring decimal cycle.
27:
  comment: "Signature: solve() -> int. The optimized solver uses the canonical bounds; naive_default() adapts the reference naive(limit_a: int, limit_b: int) with bounds 999 and 1000. The reference also terminates for negative bounds, returning zero for an empty search."
  args: {}
  return:
    type: int
    desc: The product a*b for the quadratic n*n + a*n + b with the longest initial run of prime values, where -999 <= a <= 999 and -1000 <= b <= 1000.
28:
  comment: "Signature: solve(n: int) -> int. The reference naive also terminates for every integer input and returns zero for nonpositive sizes."
  args:
    n: int
  constraints:
    - n >= 1 and n % 2 == 1
  return:
    type: int
    desc: The sum of both diagonals of the n-by-n number spiral, counting the central 1 once.
29:
  comment: "Signature: solve(max_a: int, max_b: int) -> int. The reference naive names the same positional bounds a_max and b_max. Both functions terminate for all integer bounds; a bound below 2 gives an empty search."
  args:
    max_a: int
    max_b: int
  return:
    type: int
    desc: The number of distinct a**b values for 2 <= a <= max_a and 2 <= b <= max_b.
30:
  comment: "Signature: solve() -> int. The optimized solver fixes the power at 5; naive_default() adapts the reference naive(p: int), whose termination claim requires p >= 0."
  args: {}
  return:
    type: int
    desc: The sum of integers greater than 1 that equal the sum of the fifth powers of their decimal digits.
31:
  comment: "Signature: solve(target: int, coins: list[int]) -> int. The reference count_ways_bound(amt: int, cs: list[int]) has the same positional inputs. Coin order is irrelevant; repeated entries are counted as distinct coin types. naive(amt: int) uses the module's coins list, which must contain positive values."
  args:
    target: int
    coins: list[int]
  constraints:
    - target >= 0
    - Every coin value is positive.
  return:
    type: int
    desc: The number of combinations totaling target, with unlimited coins of each listed type.
32:
  comment: "Signature: solve() -> int. naive_default() adapts naive(max_a: int, max_b: int) with bounds 99 and 9999. The optimized solver requires its FULL_MASK global to retain the value 511."
  args: {}
  return:
    type: int
    desc: The sum of distinct products whose multiplicand, multiplier, and product together use each decimal digit 1 through 9 exactly once.
33:
  comment: "Signature: solve() -> int."
  args: {}
  return:
    type: int
    desc: The denominator of the product of the four nontrivial two-digit digit-cancelling fractions, reduced to lowest terms.
34:
  comment: "Signature: solve() -> int. naive_default() adapts naive(limit: int) with the inclusive bound 2540160, computed by the optimized solver as 7 * 9!."
  args: {}
  return:
    type: int
    desc: The sum of numbers other than 1 and 2 that equal the sum of their decimal digits' factorials, through the computed bound.
35:
  comment: "Signature: solve(limit: int) -> int."
  args:
    limit: int
  constraints:
    - limit >= 0
  return:
    type: int
    desc: The number of circular primes strictly below limit, requiring every decimal digit rotation to be prime.
36:
  comment: "Signature: solve(limit: int = 1_000_000) -> int. The optimized generator covers palindromes of at most six decimal digits."
  args:
    limit: int
  constraints:
    - 0 <= limit <= 1_000_000
  return:
    type: int
    desc: The sum of numbers strictly below limit whose decimal and binary digits are both palindromes.
37:
  comment: "Signature: solve() -> int. naive_default() adapts naive(limit: int) with the exclusive bound 1_000_000."
  args: {}
  return:
    type: int
    desc: The sum of primes below one million that remain prime after every proper decimal truncation from either end, excluding single-digit primes.
38:
  comment: "Signature: solve() -> int. naive_default() adapts naive(limit: int) with the inclusive bound 9999. The optimized solver requires TARGET_MASK to retain its initialized value 1022."
  args: {}
  return:
    type: int
    desc: The largest 1-to-9 pandigital concatenated product of a positive integer at most 9999 with (1, 2, ..., k), where k is greater than one.
39:
  comment: "Signature: solve(limit: int) -> int."
  args:
    limit: int
  constraints:
    - limit >= 0
  return:
    type: int
    desc: The smallest perimeter from 0 through limit having the most integer right triangles with ordered sides a < b < c, or 0 if there are no such triangles.
40:
  comment: "Signature: solve() -> int. naive_default() adapts naive(limit: int) at 1_000_000, providing at least one million decimal digits."
  args: {}
  return:
    type: int
    desc: The product of digits at one-based positions 1, 10, 100, 1000, 10000, 100000, and 1000000 in the decimal concatenation of the positive integers.
41:
  comment: "Signature: solve(max_digits: int = 9) -> int. naive_bound(max_digits) adapts the exact-width naive(n) reference by searching all widths through max_digits."
  args:
    max_digits: int
  constraints:
    - max_digits >= 0
    - max_digits <= 9
  return:
    type: int
    desc: The largest prime whose decimal digits are a permutation of 1 through n for some n from 1 through max_digits, or zero if no such prime exists.
42:
  comment: "Signature: solve(words: list[str]) -> int."
  args:
    words: list[str]
  constraints:
    - Every word is nonempty and consists only of uppercase ASCII letters A through Z. An empty list is allowed.
  return:
    type: int
    desc: The number of words whose letter values, with A = 1 through Z = 26, sum to a positive triangular number.
43:
  comment: "Signature: solve() -> int. The PRIMES global retains its initialized value."
  args: {}
  constraints:
    - PRIMES == [2, 3, 5, 7, 11, 13, 17]
  return:
    type: int
    desc: The sum of 0-to-9 pandigital numbers whose consecutive three-digit substrings, starting with the second digit, are divisible by 2, 3, 5, 7, 11, 13, and 17.
44:
  comment: "Signature: solve(limit: int = 10_000) -> int. Only positive pentagonal indices are searched."
  args:
    limit: int
  constraints:
    - limit >= 0
  return:
    type: int
    desc: The minimum of 10**30 and all differences P(k) - P(j) for 1 <= j < k <= limit whose sum and difference are both positive pentagonal numbers. Returns 10**30 if no qualifying pair improves that bound.
45:
  comment: "Signature: solve() -> int. The reference scans triangular indices 286 through 100286; the proof establishes that this window contains the first qualifying value."
  args: {}
  return:
    type: int
    desc: The least triangular number after T(285) that is also pentagonal and hexagonal.
46:
  comment: "Signature: solve() -> int. The reference scans integers below 10_000; the proof establishes that the first counterexample lies inside this window."
  args: {}
  return:
    type: int
    desc: The least odd composite integer that cannot be written as a prime plus twice a positive square.
47:
  comment: "Signature: solve(k: int, run_len: int, start_limit: int) -> int. naive_solver adapts the original diagonal reference naive(k). General termination is conditional on the existing exists_consecutive_with_n_factors axiom."
  args:
    k: int
    run_len: int
    start_limit: int
  constraints:
    - k >= 1
    - run_len == k
    - start_limit >= 1
  return:
    type: int
    desc: The least integer starting a run of k consecutive integers each having exactly k distinct prime factors.
48:
  comment: "Signature: solve(n: int, k: int = 10) -> str. naive_digits formats the repeated-multiplication series at the same width. Nonpositive n gives the empty sum; k = 0 returns the string 0."
  args:
    n: int
    k: int
  constraints:
    - k >= 0
  return:
    type: str
    desc: The sum of i**i for 1 <= i <= n, reduced modulo 10**k and left-padded with zeros to at least k decimal characters.
49:
  comment: "Signature: solve() -> int. naive_default selects the non-example triple from naive(4, 3) and concatenates its four-digit members."
  args: {}
  return:
    type: int
    desc: The concatenation of the increasing four-digit prime arithmetic progression whose members are digit permutations, excluding (1487, 4817, 8147).
1014:
  args:
    v: int
    k: int
    t: int
    nights: tuple[str, ...]
    target: str
  constraints:
    - 1 <= t <= k <= v <= 26
    - Members are the first v uppercase letters of the alphabet.
    - Each night contains k distinct members and target contains t distinct members.
    - The nights are blocks of an existing Steiner system S(t, k, v).
    - Exactly one k-subset containing target has all its intersections with the known nights in the intersection spectrum forced by these parameters.
  return:
    type: str
    desc: The unique compatible night containing target, with its members in alphabetic order.
  comment: Both implementations use the forced intersection spectrum. The naive version enumerates all k-subsets; the optimized version enumerates only supersets of target. Inputs outside the uniqueness constraint raise ValueError.
1015:
  args:
    n: int
    modulus: int
  constraints:
    - n >= 0
    - modulus >= 1
  return:
    type: int
    desc: The number of blue/red rows of n pins for which the second player wins regardless of the starting colour, reduced modulo modulus. The empty row counts once.
  comment: "Signature: solve(n: int, modulus: int = 10**9) -> int. The naive solve enumerates every row and the original game tree, preserving gaps. It is intended only for small n."
