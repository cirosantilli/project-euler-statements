1:
  args:
    n: int
  constraints:
    - n > 1
  return:
    type: int
    desc: Sum of all the multiples of 3 or 5 below `n`.
2:
  args:
    limit: int
  constraints:
    - limit > 1
  return:
    type: int
    desc: Sum of the even-valued Fibonacci numbers which do not exceed `limit`.
3:
  args:
    n: int
  constraints:
    - n > 1
  return:
    type: int
    desc: The largest prime factor of `n`.
4:
  args:
    n: int
  constraints:
    - n > 0
  return:
    type: int
    desc: The largest palindrome made of the product of two `n`-decimal-digit numbers.
5:
  args:
    n: int
  constraints:
    - n >= 0
  return:
    type: int
    desc: The least common multiple of the integers from 1 through `n`, or 1 when `n` is zero.
6:
  args:
    n: int
  constraints:
    - n >= 0
  return:
    type: int
    desc: The square of the sum of the integers from 1 through `n`, minus the sum of their squares.
7:
  args:
    n: int
  constraints:
    - n >= 1
  return:
    type: int
    desc: The `n`'th prime number.
8:
  args:
    digits: list[int]
    k: int
  constraints:
    - len(digits) > 0
    - all(0 <= digit <= 9 for digit in digits)
    - k > 0
  return:
    type: int
    desc: The largest product of k consecutive decimal digits in the input list.
9:
  args:
    total: int
  constraints:
    - total >= 0
    - There exist positive integers a < b < c with a + b + c == total and a*a + b*b == c*c.
  return:
    type: int
    desc: The largest product a*b*c of a Pythagorean triplet with the given total.
10:
  args:
    limit: int
  constraints:
    - limit >= 0
  return:
    type: int
    desc: The sum of all primes strictly below limit.
11:
  args:
    grid: list[list[int]]
    k: int
  constraints:
    - k >= 0
    - The grid has 20 rows of 20 nonnegative integers each.
  return:
    type: int
    desc: The greatest product of k adjacent entries horizontally, vertically, or diagonally; zero if no segment fits, and one for zero-length segments.
12:
  args:
    k: int
  constraints:
    - k >= 0
  return:
    type: int
    desc: The least positive triangular number with more than k positive divisors.
13:
  args:
    nums: list[int]
    k: int
  constraints:
    - sum(nums) >= 0
    - k >= 0
  return:
    type: int
    desc: The integer represented by the first k decimal digits of the sum, or zero for an empty prefix. If k exceeds the digit count, return the whole sum.
14:
  args:
    limit: int
  return:
    type: int
    desc: The smallest starting number from 1 through limit having the longest Collatz chain, including both endpoints of the chain; zero for nonpositive limits.
15:
  args:
    n: int
  constraints:
    - n >= 0
  return:
    type: int
    desc: The number of paths through an n by n grid using only right and down steps; one for the zero grid.
16:
  args:
    n: int
  constraints:
    - n >= 0
  return:
    type: int
    desc: The sum of the decimal digits of 2**n.
17:
  args:
    n: int
  constraints:
    - 0 <= n <= 1000
    - ONES, TEENS, and TENS contain their declared English spellings, as specified by the Python Requires predicates.
  return:
    type: int
    desc: The total number of letters in the British English names of the integers from 1 through n, ignoring spaces and hyphens; zero for n = 0.
18:
  args:
    triangle: list[list[int]]
  constraints:
    - The triangle is nonempty, and row i has i + 1 entries, counting from zero.
  return:
    type: int
    desc: The greatest sum along a path from the top to the bottom, moving to either adjacent child at each row. Weights may be signed integers.
19:
  args:
    start_year: int
    end_year: int
  constraints:
    - 1900 <= start_year <= end_year
  return:
    type: int
    desc: The number of Sundays falling on the first day of a month in the inclusive range of complete calendar years.
20:
  args:
    n: int
  constraints:
    - n >= 0
  return:
    type: int
    desc: The sum of the decimal digits of n factorial, including 0 factorial = 1.
21:
  args:
    limit: int
  return:
    type: int
    desc: The sum of positive amicable numbers strictly below limit; zero for an empty range.
22:
  args:
    names: list[str]
  constraints:
    - Every character in each name is an uppercase ASCII letter A through Z. Empty names and an empty list are allowed.
  return:
    type: int
    desc: The sum of each name's alphabetical value multiplied by its one-based position after sorting the names alphabetically.
23:
  args:
    limit: int
  return:
    type: int
    desc: The sum of the positive integers at most limit that cannot be written as the sum of two abundant numbers; zero for an empty range.
24:
  args:
    digits: list[int]
    n: int
  constraints:
    - The input integers are strictly increasing.
    - 1 <= n <= factorial(len(digits))
  return:
    type: str
    desc: The concatenated decimal representations of the integers in the one-based n-th lexicographic permutation. The empty input has one permutation, rendered as an empty string.
25:
  args:
    digits: int
  constraints:
    - digits >= 1
  return:
    type: int
    desc: The least index whose Fibonacci number has at least digits decimal digits, with F_0 = 0 and F_1 = 1.
26:
  args:
    limit: int
  return:
    type: int
    desc: The smallest positive denominator below limit whose reciprocal has the longest recurring decimal cycle; zero when there is no positive denominator below limit.
27:
  args: {}
  return:
    type: int
    desc: The product a*b for the quadratic n*n + a*n + b with the longest initial run of prime values, where -999 <= a <= 999 and -1000 <= b <= 1000.
28:
  args:
    n: int
  constraints:
    - n >= 1 and n % 2 == 1
  return:
    type: int
    desc: The sum of both diagonals of the n-by-n number spiral, counting the central 1 once.
29:
  args:
    max_a: int
    max_b: int
  return:
    type: int
    desc: The number of distinct a**b values for 2 <= a <= max_a and 2 <= b <= max_b.
30:
  args: {}
  return:
    type: int
    desc: The sum of integers greater than 1 that equal the sum of the fifth powers of their decimal digits.
31:
  args:
    target: int
    coins: list[int]
  constraints:
    - target >= 0
    - Every coin value is positive.
  return:
    type: int
    desc: The number of combinations totaling target, with unlimited coins of each listed type.
32:
  args:
    width: int
  return:
    type: int
    desc: The sum of distinct products whose two positive factors and product together use each decimal digit 1 through width exactly once; zero if none exist, including widths below three or above nine.
  comment: The target could also be an arbitrary subset of the nonzero decimal digits.
33:
  args: {}
  return:
    type: int
    desc: The denominator of the product of the four nontrivial two-digit digit-cancelling fractions, reduced to lowest terms.
34:
  args:
    base: int
  constraints:
    - base >= 2
  return:
    type: int
    desc: The sum of integers with at least two digits in the given base that equal the sum of the factorials of those digits.
35:
  args:
    limit: int
  constraints:
    - limit >= 0
  return:
    type: int
    desc: The number of circular primes strictly below limit, requiring every decimal digit rotation to be prime.
36:
  args:
    limit: int
  constraints:
    - limit >= 0
  return:
    type: int
    desc: The sum of numbers strictly below limit whose decimal and binary digits are both palindromes.
37:
  args:
    base: int
  constraints:
    - base >= 2
  return:
    type: int
    desc: The sum of primes with at least two digits in the given base that remain prime after every proper truncation from either end. The search terminates when the right-truncatable-prime tree is exhausted, and diverges if that tree has arbitrarily long branches.
38:
  args:
    width: int
  return:
    type: int
    desc: The largest concatenation of n times 1 through n times k, with n positive and k at least two, whose decimal digits are exactly 1 through width once each; zero if none exists, including widths below two or above nine.
  comment: The target could also be an arbitrary subset of the nonzero decimal digits.
39:
  args:
    limit: int
  constraints:
    - limit >= 0
  return:
    type: int
    desc: The smallest perimeter from 0 through limit having the most integer right triangles with ordered sides a < b < c, or 0 if there are no such triangles.
40:
  args:
    positions: tuple[int, ...]
  constraints:
    - Every position is positive. An empty tuple is allowed.
  return:
    type: int
    desc: The product of the digits at the requested one-based positions in the decimal concatenation of the positive integers; one for an empty tuple.
41:
  args:
    max_digits: int
  constraints:
    - max_digits >= 0
    - max_digits <= 9
  return:
    type: int
    desc: The largest prime whose decimal digits are a permutation of 1 through n for some n from 1 through max_digits, or zero if no such prime exists.
42:
  args:
    words: list[str]
  constraints:
    - Every word is nonempty and consists only of uppercase ASCII letters A through Z. An empty list is allowed.
  return:
    type: int
    desc: The number of words whose letter values, with A = 1 through Z = 26, sum to a positive triangular number.
43:
  args: {}
  constraints:
    - PRIMES == [2, 3, 5, 7, 11, 13, 17]
  return:
    type: int
    desc: The sum of 0-to-9 pandigital numbers whose consecutive three-digit substrings, starting with the second digit, are divisible by 2, 3, 5, 7, 11, 13, and 17.
44:
  args:
    limit: int
  constraints:
    - limit >= 0
  return:
    type: int
    desc: The minimum of 10**30 and all differences P(k) - P(j) for 1 <= j < k <= limit whose sum and difference are both positive pentagonal numbers. Returns 10**30 if no qualifying pair improves that bound.
45:
  args:
    after: int
  return:
    type: int
    desc: The least positive number strictly greater than after that is triangular, pentagonal, and hexagonal.
46:
  args:
    after: int
  return:
    type: int
    desc: The least odd composite integer strictly greater than after that cannot be written as a prime plus twice a positive square, if one exists. The search diverges when no such counterexample exists.
47:
  args:
    k: int
    run_len: int
    start_limit: int
  constraints:
    - k >= 1
    - run_len == k
    - start_limit >= 1
  return:
    type: int
    desc: The least integer starting a run of k consecutive integers each having exactly k distinct prime factors.
48:
  args:
    n: int
    k: int
  constraints:
    - k >= 0
  return:
    type: str
    desc: The sum of i**i for 1 <= i <= n, reduced modulo 10**k and left-padded with zeros to at least k decimal characters.
49:
  args: {}
  return:
    type: int
    desc: The concatenation of the increasing four-digit prime arithmetic progression whose members are digit permutations, excluding (1487, 4817, 8147).
50:
  args:
    limit: int
  return:
    type: int
    desc: The prime strictly below limit expressible as the longest sum of consecutive ascending primes, choosing the earliest starting window on a tie; zero if there is no such prime.
51:
  args:
    target: int
  return:
    type: int
    desc: The least prime belonging to a family of at least target primes obtained by replacing a nonempty subset of equal digit positions by the same decimal digit, without leading zeros. The search diverges if no such family exists, which always holds for target > 10.
52:
  args:
    limit_mul: int
  constraints:
    - limit_mul >= 1
  return:
    type: int
    desc: The least positive integer whose multiples from 2 through limit_mul have exactly the same decimal digit multiset as itself. The search diverges for limit_mul >= 10.
53:
  args:
    limit_n: int
    threshold: int
  return:
    type: int
    desc: The number of pairs (n, r) with 1 <= n <= limit_n and 0 <= r <= n for which the binomial coefficient C(n, r) is strictly greater than threshold; zero for an empty range.
54:
  args:
    lines: Iterable[str]
  constraints:
    - The input is a finite list of lines, each describing two matching five-card hands in the reference representation.
    - Card tokens and the live VALUE_MAP and rank_values tables assign coherent rank values at most 14, as specified by Input.Valid.
  return:
    type: int
    desc: The number of games won by player one under standard poker rank and tie-break comparisons, including ace-low straights; ties are not wins.
55:
  args:
    limit: int
  return:
    type: int
    desc: The number of positive integers strictly below limit that produce no decimal palindrome in the first fifty reverse-and-add steps; zero for an empty range.
56:
  args:
    limit: int
  return:
    type: int
    desc: The maximum decimal digit sum of a**b for 0 <= a,b < limit, with 0**0 = 1; zero for an empty range.
57:
  args:
    limit: int
  return:
    type: int
    desc: The number of the first limit square-root-of-two expansions whose numerator has more decimal digits than the denominator; zero for nonpositive limits.
58:
  args: {}
  return:
    type: int
    desc: The side length of the first odd square spiral whose prime diagonal entries comprise strictly less than one tenth of all diagonal entries.
59:
  args:
    cipher: bytes
  return:
    type: int
    desc: The sum of decrypted byte values for the first lexicographic three-letter lowercase key maximizing the documented English score among ASCII-printable decryptions (also allowing LF and CR), or zero if no such key exists.
60:
  args:
    limit: int
  return:
    type: tuple[int, list[int]]
    desc: The least sum and ascending list of five distinct primes at most limit whose pairwise concatenations in either order are prime; (10**30, []) if no such set exists. First-on-tie traversal is preserved.
61:
  args:
    max_sides: int
  return:
    type: int
    desc: The greatest sum of a cycle of distinct four-digit numbers with one member of each polygonal type from three through max_sides, whose adjacent two-digit suffixes and prefixes match, including the last and first members; zero if max_sides is below three or no cycle exists.
  comment: The required polygonal types could be an arbitrary finite set, and the digit width could be any positive even integer.
62:
  args:
    k: int
  reference:
    function: naive
    args:
      target: int
    argument_mapping:
      target: k
  return:
    type: int
    desc: The least positive cube having exactly k positive cube permutations of its full decimal digit multiset, if such a cube exists. Leading-zero permutations are not additional numbers of that width. There is no finite-search zero fallback.
63:
  args:
    base: int
  constraints:
    - base >= 2
  return:
    type: int
    desc: The number of pairs of positive integers a and n for which a**n has exactly n digits in the given numeral base.
64:
  args:
    limit: int
  return:
    type: int
    desc: The number of nonsquare integers n with 2 <= n <= limit whose square-root continued fraction has an odd period; zero if limit is below two.
65:
  args:
    n: int
  constraints:
    - n >= 1
  return:
    type: int
    desc: The sum of decimal digits in the numerator of the nth continued-fraction convergent of e, reduced to lowest terms.
66:
  args:
    limit: int
  return:
    type: int
    desc: The nonsquare D with 2 <= D <= limit whose least x among integer solutions of x*x - D*y*y == 1 with x > 0 and y > 0 is greatest; the least D on ties, or zero if there are no candidates.
67:
  args:
    triangle: list[list[int]]
  constraints:
    - Row i has i + 1 entries, counting from zero.
  return:
    type: int
    desc: The greatest sum along a path from the top to the bottom, moving to either adjacent child at each row; zero for an empty triangle. Weights may be signed integers.
68:
  args:
    n: int
    digits: int
  return:
    type: str
    desc: The lexicographically greatest decimal string of length digits for a magic n-gon using each label from 1 through 2*n once, with the inner labels repeated across adjacent triples. Start at the least outer label and read clockwise. Return an empty string for n < 3 or if no ring has the requested length.
69:
  args:
    limit: int
  return:
    type: int
    desc: The least positive n at most limit maximizing n/phi(n), where phi(n) counts the positive integers at most n coprime to n; return one when limit is below one.
70:
  args:
    limit: int
  return:
    type: int
    desc: The least integer n with 1 < n <= limit whose decimal digits are a permutation of those of phi(n), minimizing n/phi(n), where phi(n) counts the positive integers at most n coprime to n. Return zero if no candidate exists.
71:
  args:
    limit: int
    num: int
    den: int
  constraints:
    - 0 < num < den
  return:
    type: int
    desc: The numerator of the greatest reduced proper fraction strictly below num/den whose positive denominator is at most limit; zero if there is no positive candidate. The target need not be reduced.
72:
  args:
    limit: int
  return:
    type: int
    desc: The number of reduced proper fractions with positive denominator at most limit; zero when limit is below two.
73:
  args:
    limit: int
    lower_num: int
    lower_den: int
    upper_num: int
    upper_den: int
  constraints:
    - lower_den > 0
    - upper_den > 0
  return:
    type: int
    desc: The number of reduced fractions n/d with 0 < n < d <= limit strictly between lower_num/lower_den and upper_num/upper_den. Endpoints need not be reduced or lie in [0, 1]; reversed or disjoint intervals have count zero.
74:
  args:
    limit: int
    target: int
  return:
    type: int
    desc: The number of positive starting values below limit whose digit-factorial chain has exactly target distinct terms before the first repetition.
75:
  args:
    limit: int
  return:
    type: int
    desc: The number of positive perimeters at most limit that admit exactly one right triangle with positive integer side lengths, ignoring the order of the two legs; zero for negative bounds.
76:
  args:
    n: int
  return:
    type: int
    desc: The number of unordered partitions of n into positive parts strictly smaller than n; one for zero, counting the empty partition, and zero for negative n.
77:
  args:
    target: int
  return:
    type: int
    desc: The least integer n >= 2 having more than target unordered partitions into primes, allowing repeated primes and one-term partitions.
78:
  args:
    mod: int
  constraints:
    - mod >= 1
  return:
    type: int
    desc: The least positive integer n whose number of integer partitions is divisible by mod, if such an n exists.
79:
  args:
    attempts: list[str]
  constraints:
    - all(len(attempt) == 3 and attempt.isdigit() for attempt in attempts)
  return:
    type: str
    desc: The lexicographically least ordering of the distinct digits appearing in the attempts, using each digit once and containing every attempt as a subsequence; raise ValueError if the ordering constraints contain a cycle.
  comment: Allowing repeated digits in the passcode gives a shortest-common-supersequence problem.
80:
  args:
    limit: int
    digits: int
  constraints:
    - limit >= 0
    - digits >= 1
  return:
    type: int
    desc: The total digit sum obtained by taking the first `digits` decimal digits of sqrt(n) for each nonsquare integer n from one through limit, including digits before the decimal point.
81:
  args:
    matrix: list[list[int]]
  constraints:
    - not matrix or all(len(row) == len(matrix[0]) for row in matrix)
  return:
    type: int
    desc: The least sum of cell values along a path from the top-left to the bottom-right cell using only right and down steps, including both endpoints; return zero if the matrix has no cells.
82:
  args:
    matrix: list[list[int]]
  constraints:
    - not matrix or all(len(row) == len(matrix[0]) for row in matrix)
    - all(value >= 0 for row in matrix for value in row)
  return:
    type: int
    desc: The least sum of cell values along a path from any left-column cell to any right-column cell using only up, down, and right steps, including both endpoints; return zero if the matrix has no cells.
83:
  args:
    matrix: list[list[int]]
  constraints:
    - not matrix or all(len(row) == len(matrix[0]) for row in matrix)
    - all(value >= 0 for row in matrix for value in row)
  return:
    type: int
    desc: The least sum of cell values along a path from the top-left to the bottom-right cell using only up, down, left, and right steps, including both endpoints; return zero if the matrix has no cells.
85:
  args:
    target: int
  return:
    type: int
    desc: The area m*n of a positive grid whose number of axis-aligned subrectangles is closest to target; choose the least pair (m, n) in lexicographic order with 1 <= m <= n on ties.
86:
  args:
    target: int
  return:
    type: int
    desc: The least nonnegative integer M for which the number of integer cuboids with 1 <= a <= b <= c <= M and an integer shortest surface path between opposite corners exceeds target; return zero for a negative target.
87:
  args:
    limit: int
  return:
    type: int
    desc: The number of distinct integers strictly below limit expressible as p^2 + q^3 + r^4 with p, q, and r prime; zero for nonpositive limits.
88:
  args:
    k_max: int
  return:
    type: int
    desc: The sum of distinct least product-sum numbers for all multiset sizes k with 2 <= k <= k_max, using positive integer factors; zero if k_max is below two.
89:
  args:
    lines: list[str]
  constraints:
    - all(len(s) > 0 and all(c in "IVXLCDM" for c in s) for s in lines)
  return:
    type: int
    desc: The sum of each input string's length minus the length of the standard minimal Roman representation of its value, parsing adjacent increasing symbols as subtractive pairs and all other symbols additively.
  comment: Valid Roman numerals are included in the broader domain of nonempty Roman-symbol strings. Outside the valid Roman grammar, the character difference can be negative. Values and string lengths are unbounded.
90:
  args:
    face_count: int
    required_pairs: list[tuple[int, int]]
  constraints:
    - all(0 <= x <= 9 and 0 <= y <= 9 for x, y in required_pairs)
  return:
    type: int
    desc: The number of unordered pairs of dice, each labeled with face_count distinct decimal digits, that can display every required pair in either orientation, with 6 and 9 interchangeable when displaying a digit. Identical dice are allowed; dice with different printed label sets remain distinct. Return zero for face counts outside zero through ten. With no requirements, every pair of dice is counted.
  comment: The decimal alphabet and the 6/9 rotation rule are fixed; both could be generalized to supplied symbols and equivalence classes.
91:
  args:
    n: int
  return:
    type: int
    desc: The number of unordered pairs of distinct nonzero integer points P and Q in the square [0,n] x [0,n] for which the triangle with vertices (0,0), P, and Q has a right angle. Return zero for nonpositive n.
  comment: The grid is square and the distinguished vertex is the origin; a rectangular grid or a supplied distinguished vertex would give broader variants.
92:
  args:
    limit_exclusive: int
  return:
    type: int
    desc: The number of positive starting values below limit_exclusive whose repeated digit-square sums reach 89.
93:
  args:
    max_digit: int
  return:
    type: tuple[int, ...]
    desc: The increasing tuple of four distinct nonnegative integers at most max_digit that maximizes the length of the run 1..n expressible using each operand exactly once, addition, subtraction, multiplication, division by nonzero values, and arbitrary parentheses. Return the lexicographically least tuple on ties, or the empty tuple if max_digit is less than three. Intermediate values are exact rationals; concatenation is not permitted.
  comment: The operand count is fixed at four; max_digit may exceed nine, generalizing decimal digits to integer operands.
100:
  args:
    limit: int
  return:
    type: int
    desc: The number of blue discs in the arrangement with least total t > limit and t >= 2 for which drawing two discs without replacement gives probability one half of both being blue.
1014:
  args:
    v: int
    k: int
    t: int
    nights: tuple[str, ...]
    target: str
  constraints:
    - 1 <= t <= k <= v <= 26
    - Members are the first v uppercase letters of the alphabet.
    - Each night contains k distinct members and target contains t distinct members.
    - The nights are blocks of an existing Steiner system S(t, k, v).
    - Exactly one k-subset containing target has all its intersections with the known nights in the intersection spectrum forced by these parameters.
  return:
    type: str
    desc: The unique compatible night containing target, with its members in alphabetic order.
1015:
  args:
    n: int
    modulus: int
  constraints:
    - n >= 0
    - modulus >= 1
  return:
    type: int
    desc: The number of blue/red rows of n pins for which the second player wins regardless of the starting colour, reduced modulo modulus. The empty row counts once.
